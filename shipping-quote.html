<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shipping — BeerHole</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700;800&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:'Montserrat',sans-serif;
      background:#0a0a0a;
      color:white;
    }

    nav{
      position:fixed;
      top:0; left:0; right:0;
      z-index:100;
      display:flex;
      align-items:center;
      gap:30px;
      padding:18px 5%;
      background:rgba(245,240,230,0.97);
      box-shadow:0 2px 12px rgba(0,0,0,.15);
    }

    .nav-logo img{ height:55px; display:block; }

    .wrap{
      max-width:520px;
      margin:0 auto;
      padding:150px 6% 100px;
    }

    h1{
      font-family:'Bebas Neue',sans-serif;
      font-size:3rem;
      color:#fe6901;
      letter-spacing:2px;
      margin-bottom:8px;
    }

    .product-line{
      color:#aaa;
      font-size:1rem;
      margin-bottom:36px;
    }

    .product-line strong{ color:#fff; }

    .card{
      background:#161616;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:26px 24px;
      margin-bottom:20px;
    }

    .card h2{
      font-family:'Barlow Condensed',sans-serif;
      font-size:1.3rem;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:1px;
      margin-bottom:16px;
      color:#fff;
    }

    .zip-row{
      display:flex;
      gap:10px;
    }

    .address-fields{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .address-row{
      display:flex;
      gap:10px;
    }

    .state-input{ max-width:70px; }
    .zip-input-small{ max-width:120px; }

    .btn-quote-full{
      width:100%;
      margin-top:14px;
    }

    input[type="text"]{
      flex:1;
      padding:14px 16px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.15);
      background:#0a0a0a;
      color:#fff;
      font-size:1rem;
      font-family:'Montserrat',sans-serif;
    }

    input[type="text"]:focus{ outline:none; border-color:#fe6901; }

    button{
      font-family:'Barlow Condensed',sans-serif;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:1px;
      cursor:pointer;
      border:none;
      transition:.2s;
    }

    .btn-quote{
      padding:14px 22px;
      background:#fe6901;
      color:#fff;
      border-radius:8px;
      font-size:.95rem;
      white-space:nowrap;
    }

    .btn-quote:hover{ background:#ff7d1f; }
    .btn-quote:disabled{ opacity:.5; cursor:not-allowed; }

    .error-msg{
      color:#ff6b6b;
      font-size:.85rem;
      margin-top:10px;
      display:none;
    }

    .quote-result{
      display:none;
      margin-top:18px;
      padding-top:18px;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .quote-amount{
      font-family:'Bebas Neue',sans-serif;
      font-size:2.2rem;
      color:#fe6901;
      letter-spacing:1px;
    }

    .quote-detail{
      color:#999;
      font-size:.85rem;
      margin-top:4px;
    }

    .local-option label{
      display:flex;
      align-items:center;
      gap:10px;
      color:#ddd;
      font-size:.95rem;
      cursor:pointer;
    }

    .local-option p{
      color:#888;
      font-size:.82rem;
      margin-top:8px;
      padding-left:26px;
    }

    .local-address-fields{
      display:none;
      flex-direction:column;
      gap:10px;
      margin-top:16px;
      padding-top:16px;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .local-address-fields.visible{ display:flex; }

    .continue-btn{
      display:block;
      width:100%;
      padding:16px;
      background:linear-gradient(45deg,#fe6901,#fe6901);
      color:#fff;
      font-size:1.1rem;
      border-radius:10px;
      margin-top:6px;
      opacity:.4;
      pointer-events:none;
    }

    .continue-btn.active{
      opacity:1;
      pointer-events:auto;
    }

    .skip-link{
      display:block;
      text-align:center;
      margin-top:16px;
      color:#777;
      font-size:.82rem;
      text-decoration:underline;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <nav>
    <a href="beerhole.html" class="nav-logo"><img src="beerhole-logo-transparent.png" alt="BeerHole"></a>
  </nav>

  <div class="wrap">
    <h1>Shipping</h1>
    <p class="product-line">Getting a rate for: <strong id="product-name">—</strong></p>

    <div class="card local-option">
      <h2>Local Delivery</h2>
      <label>
        <input type="radio" name="delivery-method" id="local-radio" value="local">
        Free hand delivery — Spokane / Spokane Valley, WA area
      </label>
      <p>Select this and enter your address below — no shipping charge. This is the address we'll deliver to, so double check it.</p>

      <div class="local-address-fields" id="local-address-fields">
        <input type="text" id="local-name" placeholder="Full name">
        <input type="text" id="local-street" placeholder="Street address">
        <input type="text" id="local-city" placeholder="City">
        <input type="text" id="local-zip" placeholder="ZIP code" inputmode="numeric" maxlength="10">
        <p class="error-msg" id="local-error-msg"></p>
      </div>
    </div>

    <div class="card">
      <h2>Ship It To Me</h2>
      <div class="address-fields">
        <input type="text" id="ship-name" placeholder="Full name">
        <input type="text" id="ship-street" placeholder="Street address">
        <div class="address-row">
          <input type="text" id="ship-city" placeholder="City">
          <input type="text" id="ship-state" placeholder="State" maxlength="2" class="state-input">
          <input type="text" id="ship-zip" placeholder="ZIP" inputmode="numeric" maxlength="10" class="zip-input-small">
        </div>
      </div>
      <button type="button" class="btn-quote btn-quote-full" id="quote-btn" onclick="getQuote()">Get Quote</button>
      <p class="error-msg" id="error-msg"></p>
      <div class="quote-result" id="quote-result">
        <div class="quote-amount" id="quote-amount"></div>
        <div class="quote-detail" id="quote-detail"></div>
      </div>
    </div>

    <button type="button" class="continue-btn" id="continue-btn" onclick="goToCheckout()">Continue to Checkout</button>
    <span class="skip-link" onclick="skipToCheckout()">Skip — use standard estimated shipping instead</span>
  </div>

  <script>
    const PRODUCTS = {
      'complete-set': { name: 'Complete Set' },
      'extra-bags': { name: 'Extra Bags' },
    };

    // Same local delivery area as the server checks — kept in sync manually.
    const LOCAL_ZIPS = new Set([
      '99201','99202','99203','99204','99205','99206','99207','99208','99212','99213',
      '99214','99215','99216','99217','99218','99223','99224','99001','99003','99004',
      '99005','99006','99009','99011','99012','99013','99016','99019','99021','99022',
      '99023','99025','99026','99027','99030','99031','99036','99037','99039','99101',
      '99109','99110','99114','99122','99139','99156','99163','99180','99347','83814',
      '83815','83854','83877','83858','83835','83805','83811','83843','83850','83861',
      '83869','83804',
    ]);

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('product');
    let currentQuoteId = null;
    let deliveryMethod = null;

    if (PRODUCTS[productId]) {
      document.getElementById('product-name').textContent = PRODUCTS[productId].name;
    } else {
      document.getElementById('product-name').textContent = 'Unknown product';
      document.getElementById('quote-btn').disabled = true;
    }

    // If the customer edits ANY address field after already getting a quote,
    // that quote no longer reflects what's on screen — invalidate it so they
    // can't continue to checkout on a stale (possibly wrong, possibly
    // typo-corrected) address without re-quoting first.
    ['ship-name', 'ship-street', 'ship-city', 'ship-state', 'ship-zip'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        if (!currentQuoteId) return; // no active quote yet, nothing to invalidate
        currentQuoteId = null;
        deliveryMethod = null;
        document.getElementById('quote-result').style.display = 'none';
        const continueBtn = document.getElementById('continue-btn');
        continueBtn.classList.remove('active');
        continueBtn.textContent = 'Continue to Checkout';
        const errorEl = document.getElementById('error-msg');
        errorEl.textContent = 'Address changed — get an updated quote before continuing.';
        errorEl.style.display = 'block';
      });
    });

    document.getElementById('local-radio').addEventListener('change', () => {
      deliveryMethod = 'local';
      currentQuoteId = null;
      document.getElementById('quote-result').style.display = 'none';
      document.getElementById('local-address-fields').classList.add('visible');
      validateLocalFields();
    });

    ['local-name', 'local-street', 'local-city', 'local-zip'].forEach(id => {
      document.getElementById(id).addEventListener('input', validateLocalFields);
    });

    function validateLocalFields(){
      const name = document.getElementById('local-name').value.trim();
      const street = document.getElementById('local-street').value.trim();
      const city = document.getElementById('local-city').value.trim();
      const zip = document.getElementById('local-zip').value.trim();
      const errorEl = document.getElementById('local-error-msg');
      const continueBtn = document.getElementById('continue-btn');

      errorEl.style.display = 'none';

      if (!name && !street && !city && !zip) {
        continueBtn.classList.remove('active');
        return;
      }

      if (zip && !LOCAL_ZIPS.has(zip)) {
        errorEl.textContent = "Sorry, that ZIP code isn't in our free local delivery area. Try the \"Ship It To Me\" option below instead.";
        errorEl.style.display = 'block';
        continueBtn.classList.remove('active');
        return;
      }

      if (name && street && city && LOCAL_ZIPS.has(zip)) {
        continueBtn.classList.add('active');
        continueBtn.textContent = 'Continue to Checkout — Free Local Delivery';
      } else {
        continueBtn.classList.remove('active');
      }
    }

    async function getQuote(){
      const name = document.getElementById('ship-name').value.trim();
      const street1 = document.getElementById('ship-street').value.trim();
      const city = document.getElementById('ship-city').value.trim();
      const state = document.getElementById('ship-state').value.trim();
      const zip = document.getElementById('ship-zip').value.trim();
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('quote-btn');
      errorEl.style.display = 'none';

      if (!name || !street1 || !city || !state) {
        errorEl.textContent = 'Please fill in your full name and complete address.';
        errorEl.style.display = 'block';
        return;
      }
      if (!/^\d{5}(-\d{4})?$/.test(zip)) {
        errorEl.textContent = 'Please enter a valid 5-digit ZIP code.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Getting Rate…';

      try {
        const resp = await fetch('/shipping-rate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product: productId, name, street1, city, state, zip }),
        });
        const data = await resp.json();

        if (!resp.ok) {
          const detail = data.details && data.details.length ? ' (' + data.details.join('; ') + ')' : '';
          throw new Error((data.error || 'Could not get a shipping rate.') + detail);
        }

        currentQuoteId = data.quoteId;
        deliveryMethod = 'standard';
        document.getElementById('local-radio').checked = false;
        document.getElementById('local-address-fields').classList.remove('visible');

        const dollars = (data.amount / 100).toFixed(2);
        document.getElementById('quote-amount').textContent = `$${dollars}`;
        document.getElementById('quote-detail').textContent = data.live
          ? `${data.carrier || ''} ${data.service || ''}`.trim() + (data.estimatedDays ? ` — est. ${data.estimatedDays} business days` : '')
          : 'Estimated rate — live rates coming soon';
        document.getElementById('quote-result').style.display = 'block';

        const continueBtn = document.getElementById('continue-btn');
        continueBtn.classList.add('active');
        continueBtn.textContent = 'Continue to Checkout';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Get Quote';
      }
    }

    function submitCheckout(quoteId, method){
      const f = document.createElement('form');
      f.method = 'POST';
      f.action = '/create-checkout-session';

      const productInput = document.createElement('input');
      productInput.type = 'hidden';
      productInput.name = 'product';
      productInput.value = productId;
      f.appendChild(productInput);

      const methodInput = document.createElement('input');
      methodInput.type = 'hidden';
      methodInput.name = 'deliveryMethod';
      methodInput.value = method;
      f.appendChild(methodInput);

      if (quoteId) {
        const quoteInput = document.createElement('input');
        quoteInput.type = 'hidden';
        quoteInput.name = 'quoteId';
        quoteInput.value = quoteId;
        f.appendChild(quoteInput);
      }

      if (method === 'local') {
        [['localName', 'local-name'], ['localStreet', 'local-street'], ['localCity', 'local-city'], ['localZip', 'local-zip']].forEach(([fieldName, elId]) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = fieldName;
          input.value = document.getElementById(elId).value.trim();
          f.appendChild(input);
        });
      }

      document.body.appendChild(f);
      f.submit();
    }

    function goToCheckout(){
      if (deliveryMethod === 'local') {
        const zip = document.getElementById('local-zip').value.trim();
        if (!LOCAL_ZIPS.has(zip)) return; // guarded, but double-check before submit
        submitCheckout(null, 'local');
      } else if (currentQuoteId) {
        submitCheckout(currentQuoteId, 'standard');
      }
    }

    function skipToCheckout(){
      submitCheckout(null, 'standard');
    }
  </script>

</body>
</html>
